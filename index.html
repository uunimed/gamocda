<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShogiKalender</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --brand-color: #0284c7;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --input-bg: #f8fafc;
            --input-focus-bg: #ffffff;
            --danger: #ef4444;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --radius: 12px;

            --prio-1: #dc2626;
            --prio-2: #ea580c;
            --prio-3: #ca8a04;
            --prio-4: #16a34a;
            --prio-5: #0d9488;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        #loginScreen {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            z-index: 5000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        #loginScreen.active { display: flex; }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: loginCardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes loginCardAppear {
            0% { transform: translateY(30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .login-logo-box {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #4f46e5, #0284c7);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
        }
        .login-logo-box svg {
            width: 38px;
            height: 38px;
            fill: #ffffff;
        }

        .login-title-area {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .login-title-area h2 {
            font-size: 26px;
            font-weight: 700;
            color: #0f172a;
        }
        .login-title-area p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .login-input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .login-input-group label {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
        }
        .login-input {
            width: 100%;
            padding: 12px 16px;
            background: #f8fafc;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }
        .login-input:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
            transition: all 0.2s ease;
            margin-top: 8px;
        }
        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 24px -5px rgba(79, 70, 229, 0.5);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            background: var(--card-bg);
            padding: 16px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            text-decoration: none;
        }

        .logo-area svg { width: 32px; height: 32px; fill: var(--brand-color); }
        h1 { font-size: 24px; font-weight: 700; color: var(--brand-color); }

        .header-actions { display: flex; gap: 12px; align-items: center; }

        .daily-alert-banner {
            background: linear-gradient(135deg, #4f46e5, #0284c7);
            color: white;
            padding: 12px 20px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            font-weight: 500;
            font-size: 15px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-primary { background-color: var(--primary); color: white; box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2); }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-outline { background-color: white; border: 1px solid var(--border-color); color: var(--text-main); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .btn-outline:hover { background-color: var(--bg-color); border-color: var(--primary); }
        .btn-danger { background-color: #fee2e2; color: var(--danger); }
        .btn-danger:hover { background-color: var(--danger); color: white; }
        .btn-sm { padding: 6px 10px; font-size: 12px; }

        .calendar-container {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .month-display { font-size: 20px; font-weight: 600; }

        .nav-buttons {
            display: flex;
            gap: 8px;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: minmax(110px, 1fr);
            gap: 8px;
            flex: 1;
        }

        .day-cell {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
        }
        .day-cell:hover { border-color: var(--primary); }
        .day-cell.other-month { opacity: 0.4; }

        .day-cell.past-date {
            background-color: #f1f5f9 !important;
            border-color: #e2e8f0 !important;
            opacity: 0.75;
        }
        .day-cell.past-date .day-number {
            color: #94a3b8 !important;
            background-color: #e2e8f0 !important;
        }
        .day-cell.past-date .event-chip {
            filter: saturate(0.55) brightness(0.85);
            opacity: 0.85;
        }

        .day-number {
            font-weight: 600;
            font-size: 14px;
            align-self: flex-end;
            color: var(--text-muted);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .day-cell.today {
            animation: pulseCellBg 1.5s infinite ease-in-out;
            border-color: #f59e0b;
        }

        .day-cell.today .day-number {
            background: #f59e0b;
            color: white;
        }

        @keyframes pulseCellBg {
            0% { background-color: var(--bg-color); }
            50% { background-color: #fef3c7; }
            100% { background-color: var(--bg-color); }
        }

        .event-chip {
            padding: 6px 8px;
            border-radius: 6px;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .event-chip-top {
            font-weight: 700;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }
        .event-chip-type {
            font-weight: 500;
            font-size: 10px;
            opacity: 0.9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.1;
        }
        .event-chip-time {
            font-weight: 400;
            font-size: 9px;
            opacity: 0.85;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.1;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 2cm;
        }
        .modal.active { display: flex; }

.modal-content {
        position: relative;
        background: linear-gradient(to bottom, #ffffff, #fcfdff);
        padding: 36px;
        border-radius: 20px;
        width: 100%;
        max-height: 100%; 
        overflow-y: auto;
        box-shadow: 0 25px 50px -12px rgba(79, 70, 229, 0.25), 0 0 0 1px rgba(226, 232, 240, 0.8);
        display: flex;
        flex-direction: column;
        gap: 24px;
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid #f1f5f9;
        padding-bottom: 16px;
        padding-right: 40px;
    }

    .close-btn {
        position: absolute;
        top: 24px;
        right: 24px;
        background: #f1f5f9; border: none; cursor: pointer; color: var(--text-muted);
        width: 36px; height: 36px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        transition: all 0.2s ease;
        z-index: 10;
    }
    .close-btn:hover { background: #fee2e2; color: var(--danger); transform: scale(1.05); }
    .close-btn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.5; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group.full { grid-column: span 2; }
        .form-group label { font-size: 13px; font-weight: 600; color: #475569; letter-spacing: 0.3px; }

        .form-control {
            padding: 12px 16px; 
            background-color: var(--input-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px; 
            font-size: 14px; 
            color: var(--text-main);
            outline: none; 
            transition: all 0.25s ease;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.02);
        }
        .form-control:hover {
            border-color: #94a3b8;
            background-color: #ffffff;
        }
        .form-control:focus { 
            border-color: var(--primary); 
            background-color: var(--input-focus-bg);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12), inset 0 1px 2px rgba(0, 0, 0, 0.02);
        }

        .form-control.error {
            border-color: var(--danger) !important;
            background-color: #fef2f2 !important;
        }

        .date-picker-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .date-picker-wrapper input[type="date"] {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background-color: var(--input-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.25s ease;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.02);
        }
        .date-picker-wrapper input[type="date"]:hover {
            border-color: #94a3b8;
            background-color: #ffffff;
        }
        .date-picker-wrapper input[type="date"]:focus {
            border-color: var(--primary);
            background-color: var(--input-focus-bg);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12), inset 0 1px 2px rgba(0, 0, 0, 0.02);
        }
        .date-picker-wrapper svg {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            stroke: var(--primary);
            pointer-events: none;
        }

        .types-manager-box {
            background: #f1f5f9;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: border-color 0.2s;
        }
        .types-manager-box:focus-within {
            border-color: var(--primary);
            background: #f8fafc;
        }
        .types-chips-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 130px;
            overflow-y: auto;
        }
        .type-pill {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            transition: all 0.2s;
        }
        .type-pill:hover {
            border-color: var(--primary);
            box-shadow: 0 2px 4px rgba(79, 70, 229, 0.1);
        }
        .type-pill button {
            background: none; border: none; cursor: pointer; color: var(--text-muted); 
            display: inline-flex; align-items: center; justify-content: center;
            transition: color 0.2s;
        }
        .type-pill button:hover {
            color: var(--text-main);
        }
        .type-pill button.del-btn:hover {
            color: var(--danger);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            border-top: 2px solid #f1f5f9;
            padding-top: 20px;
        }

        .details-list { display: flex; flex-direction: column; gap: 16px; margin-top: 10px; }

        .detail-card {
            border-radius: 14px;
            padding: 20px;
            color: #ffffff;
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease;
        }
        .detail-card:hover {
            transform: translateY(-2px);
        }

        .detail-card.past-detail-card {
            filter: saturate(0.55) brightness(0.8);
            opacity: 0.85;
        }

        .detail-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            font-weight: 700;
        }

        .detail-card-divider {
            width: 1.5px;
            height: 16px;
            background: rgba(255, 255, 255, 0.4);
        }

        .detail-card-body {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(0, 0, 0, 0.12);
            padding: 12px 16px;
            border-radius: 10px;
            backdrop-filter: blur(4px);
        }

        .detail-period {
            font-size: 13px;
            font-weight: 500;
            opacity: 0.9;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .detail-desc {
            font-size: 14px;
            line-height: 1.5;
            opacity: 0.95;
        }

        .detail-card-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 4px;
        }

        .detail-btn-action {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .detail-btn-action:hover {
            background: rgba(255, 255, 255, 0.35);
        }
        .detail-btn-action.danger:hover {
            background: #ef4444;
            border-color: #ef4444;
        }

        .mini-cal-wrapper {
            background: #f8fafc;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .mini-cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }
        .mini-cal-day {
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            background: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            user-select: none;
        }
        .mini-cal-day.active-event-day {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .mini-cal-day.active-event-day:hover {
            background: var(--primary-hover);
        }
        .mini-cal-day.disabled-day {
            opacity: 0.3;
            background: #e2e8f0;
        }
        .mini-cal-day.removed-day {
            background: #fee2e2 !important;
            color: var(--danger) !important;
            border-color: var(--danger) !important;
            text-decoration: line-through;
            opacity: 0.6;
        }

        .custom-popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .custom-popup-overlay.active { display: flex; }

        .custom-popup-box {
            background: #ffffff;
            padding: 32px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.25), 0 0 0 1px rgba(226, 232, 240, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 20px;
            animation: modernPopupAppear 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes modernPopupAppear {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .popup-icon-wrapper {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #fee2e2;
            color: var(--danger);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .popup-icon-wrapper svg {
            width: 28px;
            height: 28px;
            stroke: currentColor;
            stroke-width: 2.5;
        }

        .popup-content-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .popup-content-area h4 {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
        }
        .popup-content-area p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .popup-actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            margin-top: 4px;
        }

        #toastContainer {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast-msg {
            background: #1e293b;
            color: white;
            padding: 14px 20px;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 300px;
            animation: slideInFromRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .toast-msg.error { background: var(--danger); }
        .toast-msg.success { background: #16a34a; }

        @keyframes slideInFromRight {
            0% { transform: translateX(120%); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOutToRight {
            0% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(120%); opacity: 0; }
        }

        #loaderOverlay {
            display: flex;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(6px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 16px;
            transition: opacity 0.3s ease;
        }
        .spinner-box {
            width: 64px;
            height: 64px;

                }

        function autoFormatStartTime(input) {
            let val = input.value.replace(/\D/g, '');
            if (val.length >= 2) {
                let hours = val.substring(0, 2);
                if (parseInt(hours) > 23) hours = "23";
                val = hours + ":" + val.substring(2, 4);
            }
            input.value = val;
            if (val.length === 5) {
                document.getElementById('endTime').focus();
            }
        }

        function autoFormatEndTime(input) {
            let val = input.value.replace(/\D/g, '');
            if (val.length >= 2) {
                let hours = val.substring(0, 2);
                if (parseInt(hours) > 23) hours = "23";
                val = hours + ":" + val.substring(2, 4);
            }
            input.value = val;
        }

        function validateEndTime(endInput) {
            const startInput = document.getElementById('startTime');
            const startVal = startInput.value.trim();
            const endVal = endInput.value.trim();

            if (startVal.length === 5 && endVal.length === 5) {

                    endInput.classList.add('error');
                    showToast("Die Endzeit darf nicht vor dem Beginnzeitpunkt liegen!", "error");

                    endInput.classList.remove('error');

        function editTypePrompt(index) {
            const oldName = eventTypes[index];
            showCustomPopup({
                title: "Kategorie modifizieren",

                showInput: true,
                inputValue: oldName,
                confirmText: "speichern",

            showLoader();

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('monthDisplay').innerText = `${monthsGer[month]} ${year}`;

            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
            const lastDay = new Date(year, month + 1, 0).getDate();
            const prevLastDay = new Date(year, month, 0).getDate();

            const grid = document.getElementById('daysGrid');
            grid.innerHTML = '';

            for (let i = firstDayIndex; i > 0; i--) {
                grid.appendChild(createDayCell(prevLastDay - i + 1, true));
            }

            const today = new Date();
            const todayKey = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

            for (let i = 1; i <= lastDay; i++) {
                const isToday = i === today.getDate() && month === today.getMonth() && year === today.getFullYear();
                const formattedMonth = String(month + 1).padStart(2, '0');
                const formattedDay = String(i).padStart(2, '0');
                const dateKey = `${year}-${formattedMonth}-${formattedDay}`;

                const isPast = dateKey < todayKey;

                grid.appendChild(createDayCell(i, false, isToday, dateKey, isPast));
            }

            const totalCellsSoFar = firstDayIndex + lastDay;
            const remainingCells = totalCellsSoFar % 7 === 0 ? 0 : 7 - (totalCellsSoFar % 7);
            for (let i = 1; i <= remainingCells; i++) {
                grid.appendChild(createDayCell(i, true));
            }
        }

        function createDayCell(dayNum, isOtherMonth, isToday = false, dateKey = null, isPast = false) {
            const cell = document.createElement('div');
            cell.className = `day-cell ${isOtherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''} ${isPast ? 'past-date' : ''}`;

            const numberDiv = document.createElement('div');
            numberDiv.className = 'day-number';
            numberDiv.innerText = dayNum;
            cell.appendChild(numberDiv);

            if (!isOtherMonth && dateKey) {
                cell.onclick = () => openDayDetails(dateKey);

                Object.keys(events).forEach(id => {
                    const ev = events[id];
                    if (isDateInRange(dateKey, ev.startDate, ev.endDate)) {
                        const chip = document.createElement('div');
                        chip.className = 'event-chip';
                        chip.style.backgroundColor = priorityColors[ev.priority] || 'var(--primary)';

                        const timeStr = ev.startTime ? `${ev.startTime}${ev.endTime ? ' - ' + ev.endTime : ''}` : 'Keine Zeit';
                        chip.innerHTML = `
                            <div class="event-chip-top">${ev.title}</div>
                            <div class="event-chip-type">${ev.type}</div>
                            <div class="event-chip-time">${timeStr}</div>
                        `;
                        cell.appendChild(chip);
                    }
                });
            }

            return cell;
        }

        function isDateInRange(target, start, end) {
            return target >= start && target <= end;
        }

        function saveEvent() {
            const titleInput = document.getElementById('eventTitle');
            const startDateInput = document.getElementById('eventStartDate');
            const endDateInput = document.getElementById('eventEndDate');
            const startTimeInput = document.getElementById('startTime');
            const endTimeInput = document.getElementById('endTime');

            const title = titleInput.value.trim();
            const startDate = startDateInput.value;
            let endDate = endDateInput.value.trim();
            const startTime = startTimeInput.value.trim();
            const endTime = endTimeInput.value.trim();

            let hasError = false;
            if (!title) {
                titleInput.classList.add('error');
                hasError = true;
            }
            if (!startDate) {
                startDateInput.classList.add('error');
                hasError = true;
            }

            if (hasError) {
                showToast("Bitte vervollständigen Sie sämtliche obligatorischen Felder!", "error");
                return;
            }

            if (!endDate) {
                endDate = startDate;
            }

            if (startDate > endDate) {
                endDateInput.classList.add('error');
                showToast("Das Enddatum darf zeitlich nicht vor dem Beginndatum liegen!", "error");
                return;
            } else {
                endDateInput.classList.remove('error');
            }

            if (startTime.length === 5 && endTime.length === 5 && endTime < startTime) {
                endTimeInput.classList.add('error');
                showToast("Die Endzeit darf nicht vor dem Beginnzeitpunkt liegen!", "error");
                return;
            } else {
                endTimeInput.classList.remove('error');
            }

            const desc = document.getElementById('eventDesc').value.trim();
            const priority = document.getElementById('eventPriority').value;
            const type = document.getElementById('eventType').value;

            showLoader();
            setTimeout(() => {
                if (currentEditMode === 'single' && activeEditEventId && activeEditDateKey) {
                    const oldEv = events[activeEditEventId];
                    if (oldEv) {
                        let allDays = [];
                        let curr = new Date(oldEv.startDate);
                        let last = new Date(oldEv.endDate);
                        while (curr <= last) {
                            allDays.push(curr.toISOString().split('T')[0]);
                            curr.setDate(curr.getDate() + 1);
                        }

                        if (allDays.length <= 1) {
                            delete events[activeEditEventId];
                        } else if (activeEditDateKey === oldEv.startDate) {
                            let nextD = new Date(oldEv.startDate);
                            nextD.setDate(nextD.getDate() + 1);
                            oldEv.startDate = nextD.toISOString().split('T')[0];
                        } else if (activeEditDateKey === oldEv.endDate) {
                            let prevD = new Date(oldEv.endDate);
                            prevD.setDate(prevD.getDate() - 1);
                            oldEv.endDate = prevD.toISOString().split('T')[0];
                        } else {
                            let prevD = new Date(activeEditDateKey);
                            prevD.setDate(prevD.getDate() - 1);
                            let nextD = new Date(activeEditDateKey);
                            nextD.setDate(nextD.getDate() + 1);

                            let newEvId = 'evt_' + Date.now();
                            events[newEvId] = { ...oldEv, startDate: nextD.toISOString().split('T')[0] };
                            oldEv.endDate = prevD.toISOString().split('T')[0];
                        }
                    }
                    let newId = 'evt_' + Date.now();
                    events[newId] = { title, desc, priority, type, startDate: activeEditDateKey, endDate: activeEditDateKey, startTime, endTime };

                } else if (currentEditMode === 'from_date' && activeEditEventId && activeEditDateKey) {
                    const oldEv = events[activeEditEventId];
                    if (oldEv) {
                        let prevD = new Date(activeEditDateKey);
                        prevD.setDate(prevD.getDate() - 1);
                        let prevStr = prevD.toISOString().split('T')[0];

                        if (prevStr >= oldEv.startDate) {
                            oldEv.endDate = prevStr;
                        } else {
                            delete events[activeEditEventId];
                        }
                    }
                    let newId = 'evt_' + Date.now();
                    events[newId] = { title, desc, priority, type, startDate: startDate, endDate: endDate, startTime, endTime };

                } else {
                    let id = document.getElementById('eventId').value;
                    if (!id) {
                        id = 'evt_' + Date.now();
                    }
                    events[id] = { title, desc, priority, type, startDate, endDate, startTime, endTime };
                }

                currentEditMode = null;
                activeEditEventId = null;
                activeEditDateKey = null;

                syncToFirebase();
                closeEventModal();
                renderCalendar();
                updateDailyBanner();
                hideLoader();
                showToast("Termin erfolgreich im System hinterlegt!");
            }, 200);
        }

        function formatDateToDDMMYY(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                return `${parts[2]}.${parts[1]}.${parts[0].slice(-2)}`;
            }
            return dateStr;
        }

        function renderDayDetailsList(dateKey) {

            const today = new Date();
            const todayKey = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            const isDatePast = dateKey < todayKey;

            let foundAny = false;
            Object.keys(events).forEach(id => {
                const ev = events[id];
                if (isDateInRange(dateKey, ev.startDate, ev.endDate)) {
                    foundAny = true;

                    const cardBgColor = priorityColors[ev.priority] || 'var(--primary)';
                    const timeStr = ev.startTime ? `${ev.startTime}${ev.endTime ? ' - ' + ev.endTime : ''}` : 'Keine Zeitangabe hinterlegt';
                    const formattedPeriod = `${formatDateToDDMMYY(ev.startDate)} - ${formatDateToDDMMYY(ev.endDate)}`;

                    const item = document.createElement('div');
                    item.className = `detail-card ${isDatePast ? 'past-detail-card' : ''}`;
                    item.style.backgroundColor = cardBgColor;

                    let actionButtonsHtml = '';
                    if (isDatePast) {
                        actionButtonsHtml = `<span style="font-size: 13px; font-weight: 600; background: rgba(0,0,0,0.2); padding: 4px 10px; border-radius: 6px;">Abgeschlossener Termin</span>`;
                    } else {
                        actionButtonsHtml = `
                            <button class="detail-btn-action" onclick="openEditOptionsModal('${id}', '${dateKey}')">Bearbeiten</button>
                            <button class="detail-btn-action danger" onclick="openDeleteOptionsModal('${id}', '${dateKey}')">Löschen</button>
                        `;
                    }

                    item.innerHTML = `
                        <div class="detail-card-header">
                            <span>${ev.title}</span>
                            <span class="detail-card-divider"></span>
                            <span style="opacity: 0.9; font-weight: 500; font-size: 14px;">${ev.type}</span>
                            <span class="detail-card-divider"></span>
                            <span style="opacity: 0.85; font-size: 13px; font-weight: 400;">${timeStr}</span>
                        </div>
                        <div class="detail-card-body">
                            <div class="detail-period">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                                Zeitraum: ${formattedPeriod}
                            </div>
                            <div class="detail-desc">${ev.desc ? ev.desc : 'Keine Beschreibung vorhanden'}</div>
                        </div>
                        <div class="detail-card-footer">
                            ${actionButtonsHtml}
                        </div>
                    `;
                    listContainer.appendChild(item);
                }
            });

            if (!foundAny) {
                listContainer.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:30px; font-weight: 500;">Für das ausgewählte Datum sind keine Termine verzeichnet.</div>`;
            }
        }

        function openEditOptionsModal(eventId, dateKey) {
            const today = new Date();
            const todayKey = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            if (dateKey < todayKey) {
                showToast("Die Modifikation vergangener Termine ist ausgeschlossen.", "error");
                return;

        function promptConfirmDeleteChoice(choice) {
            const ev = events[activeDeleteEventId];
            let msg = "Möchten Sie diesen Vorgang tatsächlich durchführen?";
            if (choice === 1) {
                msg = `Möchten Sie den Eintrag vom ${formatDateToDDMMYY(activeDeleteDateKey)} entfernen?`;
            } else if (choice === 4) {
                msg = `Möchten Sie den gesamten Termin ("${ev.title}") unwiderruflich löschen?`;
            }

            showCustomPopup({
                title: "Löschvorgang bestätigen",
                text: msg,
                showInput: false,
                confirmText: "Löschen",
                onConfirm: (confirmed) => {
                    if (confirmed) {
                        closeDeleteOptionsModal();
                        executeDeleteChoice(choice);
                    }
                }
            });

        function executeDeleteChoice(choice) {
            const ev = events[activeDeleteEventId];
            if (choice === 1) {
                showLoader();
                setTimeout(() => {
                    let allDays = [];
                    let curr = new Date(ev.startDate);
                    let last = new Date(ev.endDate);
                    while (curr <= last) {
                        allDays.push(curr.toISOString().split('T')[0]);
                        curr.setDate(curr.getDate() + 1);
                    }

                    if (allDays.length <= 1) {
                        delete events[activeDeleteEventId];
                    } else if (activeDeleteDateKey === ev.startDate) {
                        let nextD = new Date(ev.startDate);
                        nextD.setDate(nextD.getDate() + 1);
                        ev.startDate = nextD.toISOString().split('T')[0];
                    } else if (activeDeleteDateKey === ev.endDate) {
                        let prevD = new Date(ev.endDate);
                        prevD.setDate(prevD.getDate() - 1);
                        ev.endDate = prevD.toISOString().split('T')[0];
                    } else {
                        let prevD = new Date(activeDeleteDateKey);
                        prevD.setDate(prevD.getDate() - 1);
                        let nextD = new Date(activeDeleteDateKey);
                        nextD.setDate(nextD.getDate() + 1);

                        let newEvId = 'evt_' + Date.now();
                        events[newEvId] = { ...ev, startDate: nextD.toISOString().split('T')[0] };
                        ev.endDate = prevD.toISOString().split('T')[0];
                    }
                    syncToFirebase();
                    renderCalendar();
                    if (currentActiveDayForKey) renderDayDetailsList(currentActiveDayForKey);
                    hideLoader();
                    showToast("Ausgewählter Tag wurde entfernt.");
                }, 200);

            } else if (choice === 4) {
                showLoader();
                setTimeout(() => {
                    delete events[activeDeleteEventId];
                    syncToFirebase();
                    renderCalendar();
                    if (currentActiveDayForKey) renderDayDetailsList(currentActiveDayForKey);
                    hideLoader();
                    showToast("Gesamter Termin erfolgreich gelöscht.");
                }, 200);
            }
        }

        function renderMiniCalendar() {
            const ev = events[activeDeleteEventId];
            if (!ev) return;

            const [y, m, d] = ev.startDate.split('-');
            const miniDate = new Date(parseInt(y), parseInt(m) - 1, 1);

            document.getElementById('miniCalHeader').innerText = `${monthsGer[miniDate.getMonth()]} ${miniDate.getFullYear()}`;

            const year = miniDate.getFullYear();
            const month = miniDate.getMonth();
            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
            const lastDay = new Date(year, month + 1, 0).getDate();
            const prevLastDay = new Date(year, month, 0).getDate();

            const grid = document.getElementById('miniCalDaysGrid');
            grid.innerHTML = '';

            for (let i = firstDayIndex; i > 0; i--) {
                const cell = document.createElement('div');
                cell.className = 'mini-cal-day disabled-day';
                cell.innerText = prevLastDay - i + 1;
                grid.appendChild(cell);
            }

            for (let i = 1; i <= lastDay; i++) {
                const formattedMonth = String(month + 1).padStart(2, '0');
                const formattedDay = String(i).padStart(2, '0');
                const dateKey = `${year}-${formattedMonth}-${formattedDay}`;

                const cell = document.createElement('div');
                cell.className = 'mini-cal-day';
                cell.innerText = i;

                if (isDateInRange(dateKey, ev.startDate, ev.endDate)) {
                    cell.classList.add('active-event-day');
                    cell.onclick = () => toggleMiniCalDay(dateKey, cell);
                } else {
                    cell.classList.add('disabled-day');
                }

                grid.appendChild(cell);
            }
        }

        function toggleMiniCalDay(dateKey, cell) {
            if (miniCalRemovedDays.has(dateKey)) {
                miniCalRemovedDays.delete(dateKey);
                cell.classList.remove('removed-day');
                cell.classList.add('active-event-day');
            } else {
                miniCalRemovedDays.add(dateKey);
                cell.classList.remove('active-event-day');
                cell.classList.add('removed-day');
            }
        }

        function confirmMiniCalDelete() {
            if (miniCalRemovedDays.size === 0) {
                showToast("Es wurden keine Tage zur Entfernung selektiert.", "error");
                return;
            }

            showCustomPopup({
                title: "Tage ausschließen",
                text: `Möchten Sie die ${miniCalRemovedDays.size} selektierten Tage tatsächlich entfernen?`,
                showInput: false,
                confirmText: "Löschen",
                onConfirm: (confirmed) => {
                    if (confirmed) {
                        showLoader();
                        setTimeout(() => {
                            const ev = events[activeDeleteEventId];
                            let curr = new Date(ev.startDate);
                            let last = new Date(ev.endDate);
                            let remainingDays = [];

                            while (curr <= last) {
                                let dStr = curr.toISOString().split('T')[0];
                                if (!miniCalRemovedDays.has(dStr)) {
                                    remainingDays.push(dStr);
                                }
                                curr.setDate(curr.getDate() + 1);
                            }

                            if (remainingDays.length === 0) {
                                delete events[activeDeleteEventId];
                            } else {
                                ev.startDate = remainingDays[0];
                                ev.endDate = remainingDays[remainingDays.length - 1];

                                let blockStart = remainingDays[0];
                                let prevDate = new Date(blockStart);

                                for (let i = 1; i < remainingDays.length; i++) {
                                    let currentDateObj = new Date(remainingDays[i]);
                                    let diffTime = Math.abs(currentDateObj - prevDate);
                                    let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                                    if (diffDays > 1) {
                                        ev.endDate = prevDate.toISOString().split('T')[0];
                                        let newEvId = 'evt_' + Date.now() + '_' + i;
                                        events[newEvId] = { ...ev, startDate: currentDateObj.toISOString().split('T')[0], endDate: remainingDays[remainingDays.length - 1] };
                                        break;
                                    }
                                    prevDate = currentDateObj;
                                }
                            }

                            syncToFirebase();
                            closeCustomDeleteCalendarModal();
                            renderCalendar();
                            if (currentActiveDayForKey) {
                                renderDayDetailsList(currentActiveDayForKey);
                            }
                            hideLoader();
                            showToast("Selektierte Tage erfolgreich entfernt.");
                        }, 200);
                    }
                }
            });
        }

        function updateDailyBanner() {
            const now = new Date();
            const currentHour = now.getHours();

            let targetDate = new Date();
            let isTomorrow = false;

            if (currentHour >= 18) {
                targetDate.setDate(targetDate.getDate() + 1);
                isTomorrow = true;
            }

            const y = targetDate.getFullYear();
            const m = String(targetDate.getMonth() + 1).padStart(2, '0');
            const d = String(targetDate.getDate()).padStart(2, '0');

            const dateStrFormatted = `${d}.${m}.${y.toString().slice(-2)}`;
            const dateKeyQuery = `${y}-${m}-${d}`;

            let dayEvents = [];
            Object.keys(events).forEach(id => {
                const ev = events[id];
                if (isDateInRange(dateKeyQuery, ev.startDate, ev.endDate)) {
                    const timeStr = ev.startTime ? ` (${ev.startTime})` : '';
                    dayEvents.push(`${ev.title}${timeStr}`);
                }
            });

            const bannerTextSpan = document.getElementById('alertText');
            if (isTomorrow) {
                if (dayEvents.length > 0) {
                    bannerTextSpan.innerText = `Terminübersicht für den ${dateStrFormatted}: ${dayEvents.join(', ')}`;
                } else {
                    bannerTextSpan.innerText = `Für den ${dateStrFormatted} sind keine Einträge verzeichnet`;
                }
            } else {
                if (dayEvents.length > 0) {
                    bannerTextSpan.innerText = `Aktuelle Termine für heute: ${dayEvents.join(', ')}`;
                } else {
                    bannerTextSpan.innerText = `Für den heutigen Tag liegen keine Einträge vor`;
                }
            }
        }

        function confirmLogout() {
            showCustomPopup({
                title: "Sitzung beenden",
                text: "",
                showInput: false,
                confirmText: "Abmelden",
                onConfirm: (confirmed) => {
                    if (confirmed) {
                        showLoader();
                        setTimeout(() => {
                            sessionStorage.removeItem('shogi_auth');
                            window.location.reload();
                        }, 400);
                    }
                }
            });
        }
    </script>
